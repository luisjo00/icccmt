<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="t-reducido">
<!-- Sello de la Iglesia Cristiana Camino al Cielo Mateo 7:14 (Los Patios,
     Norte de Santander). Redibujo vectorial del avatar histórico del canal: se
     conservan el anillo, la menorá centrada y el nombre en arco; lo que cambia
     es la ejecución. Colores en datos/marca.json. El texto está convertido a
     contornos (Archivo Black, SIL OFL 1.1): el archivo no depende de ninguna
     fuente instalada. Sin degradados: sólo rellenos planos. -->
  <title id="t-reducido">Sello reducido de la Iglesia Cristiana Camino al Cielo</title>
